# ── Production database (Hostinger PostgreSQL or your VPS DB) ──────────────────
spring.datasource.url=jdbc:postgresql://YOUR_DB_HOST:5432/medicare_db
spring.datasource.username=YOUR_DB_USER
spring.datasource.password=YOUR_DB_PASSWORD

# ── Security ───────────────────────────────────────────────────────────────────
jwt.secret=CHANGE_THIS_TO_A_STRONG_SECRET_AT_LEAST_256_BITS_LONG_FOR_PRODUCTION
jwt.expiration=86400000

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8081

# ── JPA ────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── File uploads ───────────────────────────────────────────────────────────────
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── AR cloud sync ──────────────────────────────────────────────────────────────
exercise.cloud.base-url=https://odd-studio.in/ARthomovev1/exercises
