spring.datasource.url=jdbc:postgresql://localhost:5432/medicare_db
spring.datasource.username=postgres
spring.datasource.password=qwerty

jwt.secret=medicare_secret_key_change_this_in_production_must_be_at_least_256_bits_long
jwt.expiration=86400000

server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql on every startup BEFORE Hibernate, creating tables if missing
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ── Email (SMTP) ─────────────────────────────────────────────────────────────
# Fill in your Gmail address and App Password (not your regular Gmail password).
# To get an App Password: Google Account → Security → 2-Step Verification → App Passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail@gmail.com
spring.mail.password=your-app-password-here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend URL used in the password setup link
app.frontend-url=http://localhost:3000

logging.level.com.medicare=DEBUG
# Patient module file uploads
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Cloud exercise JSON sync — base URL of AR exercise JSONs on Hostinger
exercise.cloud.base-url=https://odd-studio.in/ARthomovev1/exercises
